name: Build and Validate

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify whitespace formatting
        run: |
          dotnet format whitespace Source/IsoRim.csproj --verify-no-changes
          dotnet format whitespace Source17/IsoRim.csproj --verify-no-changes

      - name: Verify code style
        run: |
          dotnet format style Source/IsoRim.csproj --verify-no-changes
          dotnet format style Source17/IsoRim.csproj --verify-no-changes

      - name: Build RimWorld 1.7
        run: dotnet build Source17/IsoRim.csproj -c Release -nologo

      - name: Build RimWorld 1.6
        run: dotnet build Source/IsoRim.csproj -c Release -nologo -p:RimWorldVersion=1.6

      - name: Build RimWorld 1.5
        run: dotnet build Source/IsoRim.csproj -c Release -nologo -p:RimWorldVersion=1.5

      - name: Validate mod and assemblies
        run: python3 tools/validate_mod.py --check-assemblies

      # Package 1.7.4979-alpha is portable compatibility. Exact 4980 acceptance
      # runs locally on the frozen epic head with the approved game and bundled CLR.
      - name: Prepared models portable host and compatibility controls
        run: python3 tools/prepared_models_gate.py ci --dotnet dotnet --head HEAD
